[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hamilton-vault"
version = "0.2.0"
description = "SQL-first dbtVault-style core using Apache Hamilton and metadata"
requires-python = ">=3.10"
dependencies = ["sqlglot>=30.8,<31", "apache-hamilton>=1.90,<2", "duckdb>=1.4,<2", "pydantic>=2.10,<3", "pytz>=2024.1"]

[project.optional-dependencies]
databricks = ["databricks-sql-connector>=3,<5", "databricks-sdk>=0.40,<1"]
snowflake = ["snowflake-connector-python>=3,<5"]
clickhouse = ["clickhouse-connect>=0.8,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
hamilton-vault = "vault.cli:main"

[tool.setuptools.packages.find]
include = ["vault*"]
